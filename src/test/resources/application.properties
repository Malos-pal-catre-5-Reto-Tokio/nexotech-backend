# Configuración SOLO para las pruebas: base H2 en memoria (modo PostgreSQL), sin tocar Neon.
# Hibernate crea las tablas desde las entidades y las borra al terminar.
spring.application.name=nexotech-backend-test
spring.datasource.url=jdbc:h2:mem:nexotech;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=clave-solo-para-pruebas-de-al-menos-32-caracteres
jwt.access-minutos=15
jwt.refresh-dias=7
jwt.cookie-secure=false
jwt.cookie-same-site=Lax

cors.origenes=http://localhost:5173
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
