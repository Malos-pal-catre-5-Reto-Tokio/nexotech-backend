spring.application.name=nexotech-backend
server.port=8080

# Neon (PostgreSQL). Los valores reales se definen como variables de entorno (ver README):
#   DB_URL      jdbc:postgresql://<host>.neon.tech/<base>?sslmode=require
#   DB_USER     usuario de Neon
#   DB_PASSWORD contraseña de Neon
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon suspende la base cuando no se usa: un pool chico evita conexiones muertas.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=20000

# El esquema lo crea database/nexotech-neon.sql; Hibernate solo comprueba que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Seguridad (JWT) ---
# JWT_SECRET: clave para firmar los tokens, de al menos 32 caracteres. Generar una con:  openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.access-minutos=15
jwt.refresh-dias=7
# En producción con HTTPS: jwt.cookie-secure=true
jwt.cookie-secure=false
jwt.cookie-same-site=Lax

# Orígenes del frontend autorizados (separados por coma)
cors.origenes=http://localhost:5173

# La autenticación la hace AuthService con JWT; se desactiva el usuario "user" con clave aleatoria que crea Spring.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
